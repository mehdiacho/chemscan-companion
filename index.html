<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChemScan Companion</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="panel" class="panel">
      <header class="titlebar" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>ChemScan <b>LCA</b></span>
        <div class="actions">
          <button id="pin" class="icon" title="Always on top" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z" /></svg>
          </button>
          <button id="to-bubble" class="icon" title="Shrink to bubble">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" /></svg>
          </button>
          <button id="minimize" class="icon" title="Minimize to taskbar">
            <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
          </button>
          <button id="close" class="icon danger" title="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button role="tab" data-view="calc">ChemScan</button>
        <button role="tab" data-view="names">Names</button>
        <button role="tab" data-view="app">App<span id="update-dot" class="dot" hidden></span></button>
      </nav>

      <div id="view-calc" class="view">
      <section class="form">
        <label class="field-label">State</label>
        <div class="segmented" data-name="state">
          <button data-value="solid">Solid</button>
          <button data-value="liquid">Liquid</button>
          <button data-value="gas">Gas</button>
        </div>

        <label class="field-label">Type</label>
        <div class="segmented" data-name="nature">
          <button data-value="organic">Organic</button>
          <button data-value="inorganic">Inorganic</button>
        </div>

        <div class="row">
          <div class="field">
            <label class="field-label" for="weight">Weight (g)</label>
            <input id="weight" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" />
          </div>
          <div class="field">
            <label class="field-label" for="version">LCA version</label>
            <input id="version" type="text" placeholder="1.04" spellcheck="false" />
          </div>
        </div>
      </section>

      <section class="results" aria-live="polite">
        <div class="result" data-key="ionSize">
          <span class="result-label">Ion size</span>
          <span class="result-value">–</span>
        </div>
        <div class="result" data-key="deltaV">
          <span class="result-label">Delta V</span>
          <span class="result-value">–</span>
        </div>
        <div class="result" data-key="threshold">
          <span class="result-label">Threshold</span>
          <span class="result-value">–</span>
        </div>
        <div class="result" data-key="matrixSize">
          <span class="result-label">Matrix size</span>
          <span class="result-value">–</span>
        </div>
      </section>
      <p id="message" class="message"></p>
      </div>

      <div id="view-names" class="view" hidden>
        <div class="names-bar">
          <input id="name-search" type="search" placeholder="Search names" spellcheck="false" autocomplete="off" />
          <div class="segmented small" data-name="nameFilter">
            <button data-value="all">All</button>
            <button data-value="circled">Circled</button>
          </div>
        </div>
        <p id="name-count" class="count"></p>
        <div id="name-list" class="name-list"></div>
      </div>

      <div id="view-app" class="view" hidden>
        <section class="app-section">
          <div class="setting">
            <div>
              <span class="setting-title">Automatic updates</span>
              <span class="setting-hint">Checks GitHub on launch and every 6 hours, then installs and restarts.</span>
            </div>
            <button id="auto-update" class="switch" role="switch" aria-checked="true"><span></span></button>
          </div>
          <button id="check-update" class="primary">Check for updates</button>
          <p id="update-status" class="message"></p>
          <p class="version">Version <span id="app-version">�</span></p>
        </section>
      </div>
    </main>

    <button id="bubble" class="bubble" title="Open ChemScan Companion" hidden>
      <span>CS</span>
    </button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
