[package]
name = "chemscan-companion"
description = "Compact always-on-top settings calculator for the ChemScan LCA"
version = "0.1.0"
edition = "2021"

[lib]
name = "chemscan_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
